<!doctype html><html><head><meta charset="utf-8"><title>Grafik-demo</title>
<style>html,body{margin:0;background:#0b1422}canvas{display:block}</style></head><body>
<canvas id="cv" width="720" height="720"></canvas>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), MODE=location.hash.slice(1)||'retning';
let T=0; const ZF=0.9;
const rnd=(()=>{let s=7;return()=>{s=(s*16807)%2147483647;return s/2147483647;};})();
const DEN={shirt:'#d0021b',trim:'#ffffff',shorts:'#ffffff',num:'#ffffff',sock:'#d0021b'}, SWE={shirt:'#fecc02',trim:'#006aa7',shorts:'#006aa7',num:'#006aa7',sock:'#fecc02'};
function limb(a,b,w,c){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
function shadow(x,y){ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x,y+0.03,0.36,0.13,0,0,7);ctx.fill();}
/* ---- i dag: kun set fra siden ---- */
function drawSide(p,face){
  const K=p.kit, s=Math.sin(p.ph), c=Math.cos(p.ph);
  ctx.save(); ctx.translate(p.x,p.y); ctx.scale(face,1);
  const lf=[-0.09+s*0.26,-Math.max(0,c)*0.13], rf=[0.09-s*0.26,-Math.max(0,-c)*0.13], lh=[-0.3-s*0.17,-0.88], rh=[0.3+s*0.17,-0.88];
  limb([-0.23,-1.3],lh,0.1,p.skin); limb([-0.08,-0.8],lf,0.13,p.skin); limb([0.08,-0.8],rf,0.13,p.skin);
  limb([lf[0]*0.7,lf[1]-0.15],lf,0.135,K.sock); limb([rf[0]*0.7,rf[1]-0.15],rf,0.135,K.sock);
  ctx.fillStyle='#1d1f24'; ctx.beginPath(); ctx.ellipse(lf[0]+0.03,lf[1],0.1,0.05,0,0,7); ctx.ellipse(rf[0]+0.03,rf[1],0.1,0.05,0,0,7); ctx.fill();
  ctx.fillStyle=K.shorts; ctx.fillRect(-0.2,-0.95,0.4,0.24); ctx.fillStyle=K.shirt; ctx.fillRect(-0.22,-1.4,0.44,0.52); ctx.fillStyle=K.trim; ctx.fillRect(-0.22,-1.4,0.44,0.07);
  ctx.save(); ctx.scale(face,1); ctx.fillStyle=K.num; ctx.font='700 0.28px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.num,0,-1.1); ctx.restore();
  ctx.fillStyle=p.skin; ctx.beginPath(); ctx.arc(0.01,-1.56,0.155,0,7); ctx.fill(); ctx.fillStyle=p.hair; ctx.beginPath(); ctx.arc(0,-1.6,0.16,Math.PI*1.05,Math.PI*2.05); ctx.fill();
  ctx.fillStyle='#1d1f24'; ctx.beginPath(); ctx.arc(0.08,-1.56,0.022,0,7); ctx.fill();
  limb([0.23,-1.3],rh,0.1,p.skin); ctx.restore();
}
/* ---- nyt: forfra og bagfra ---- */
function drawFrontBack(p,front){
  const K=p.kit, s=Math.sin(p.ph), c=Math.cos(p.ph);
  ctx.save(); ctx.translate(p.x,p.y);
  const step=0.12, lfY=-Math.max(0,s)*0.16, rfY=-Math.max(0,-s)*0.16;      // benene løftes skiftevis
  const la=s*0.18, ra=-s*0.18;                                              // armene svinger frem og tilbage (forkortes i højden)
  // arme bag kroppen (bagfra ses de foran, forfra bagved) - tegn først de fjerne
  const armL=[[-0.24,-1.3],[-0.34,-0.86+la]], armR=[[0.24,-1.3],[0.34,-0.86+ra]];
  if(!front){ limb(...armL,0.1,p.skin); limb(...armR,0.1,p.skin); }
  limb([-0.1,-0.8],[-0.12,lfY],0.14,p.skin); limb([0.1,-0.8],[0.12,rfY],0.14,p.skin);
  limb([-0.12,lfY-0.2],[-0.12,lfY],0.15,K.sock); limb([0.12,rfY-0.2],[0.12,rfY],0.15,K.sock);
  ctx.fillStyle='#1d1f24'; ctx.beginPath(); ctx.ellipse(-0.12,lfY+0.01,0.07,0.06,0,0,7); ctx.ellipse(0.12,rfY+0.01,0.07,0.06,0,0,7); ctx.fill();
  ctx.fillStyle=K.shorts; ctx.fillRect(-0.22,-0.95,0.44,0.25);
  ctx.fillStyle=K.shirt; ctx.beginPath(); ctx.roundRect(-0.25,-1.42,0.5,0.55,0.08); ctx.fill();
  ctx.fillStyle=K.trim; ctx.fillRect(-0.25,-1.42,0.5,0.06); ctx.fillRect(-0.25,-0.95,0.5,0.035);
  ctx.fillStyle=K.num; ctx.textAlign='center'; ctx.textBaseline='middle';
  if(front){ ctx.font='700 0.17px Arial'; ctx.fillText(p.num,0.1,-1.25); }                  // lille nummer på brystet
  else { ctx.font='700 0.13px Arial'; ctx.fillText(p.name.toUpperCase(),0,-1.33); ctx.font='700 0.3px Arial'; ctx.fillText(p.num,0,-1.11); } // navn og stort nummer på ryggen
  ctx.fillStyle=p.skin; ctx.beginPath(); ctx.arc(0,-1.58,0.16,0,7); ctx.fill();
  ctx.fillStyle=p.hair;
  if(front){ ctx.beginPath(); ctx.arc(0,-1.6,0.165,Math.PI,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1d1f24'; ctx.beginPath(); ctx.arc(-0.055,-1.57,0.022,0,7); ctx.arc(0.055,-1.57,0.022,0,7); ctx.fill();
    ctx.strokeStyle='#7a3b2a'; ctx.lineWidth=0.02; ctx.beginPath(); ctx.arc(0,-1.52,0.05,0.2,Math.PI-0.2); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(0,-1.59,0.165,0,7); ctx.fill(); }
  if(front){ limb(...armL,0.1,p.skin); limb(...armR,0.1,p.skin); }
  ctx.restore();
}
function drawNew(p){ const ax=Math.abs(p.vx), ay=Math.abs(p.vy); if(!ax&&!ay) return drawFrontBack(p,true);
  if(ax>ay*0.8) drawSide(p,Math.sign(p.vx)||1); else drawFrontBack(p,p.vy>0); }
/* ---- bane ---- */
function court(x0,w){ ctx.fillStyle='#2f78c9'; ctx.fillRect(x0,0,w,18); ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=0.06;
  ctx.fillStyle='#e0632f'; ctx.beginPath(); ctx.arc(x0+w/2,-2,5.5,0,Math.PI); ctx.fill(); ctx.stroke();
  ctx.setLineDash([0.3,0.25]); ctx.beginPath(); ctx.arc(x0+w/2,-2,8.2,0.15,Math.PI-0.15); ctx.stroke(); ctx.setLineDash([]); }
/* ---- spillere i sløjfer ---- */
const SKIN=['#f2c7a5','#e8b48c','#c98d62','#f5d2b8','#a86f45'], HAIR=['#2b1a10','#5a3a1e','#d9b56a','#1a1a1a','#8a4a22'];
const names=['Gidsel','Pytlick','Landin','Gottfridsson','Palicka','Wanne'], nums=[19,43,4,24,12,15];
const runners=[];
for(let side=0;side<2;side++) for(let i=0;i<3;i++){ runners.push({side,i,kit:i===1?SWE:DEN,skin:SKIN[i+side],hair:HAIR[i*2%5],name:names[i+(i===1?2:0)],num:nums[i+(i===1?2:0)],ph:rnd()*6,x:0,y:0,vx:0,vy:0}); }
function pathPos(t,i){ // rektangulær sløjfe: op, til siden, ned, tilbage
  const w=3.4,h=6.6, L=2*(w+h), u=((t*3.1+i*L/3)%L+L)%L;
  if(u<h) return [0,h-u]; if(u<h+w) return [u-h,0]; if(u<2*h+w) return [w,u-h-w]; return [w-(u-2*h-w),h];
}
/* ---- tilskuere og projektører ---- */
const crowd=[]; for(let side=0;side<2;side++) for(let row=0;row<9;row++) for(let k=0;k<26;k++){
  const den=rnd()<0.55; crowd.push({side,row,k,c:den?(rnd()<0.8?'#d0021b':'#ffffff'):(rnd()<0.8?'#fecc02':'#006aa7'),skin:SKIN[Math.floor(rnd()*5)],hair:HAIR[Math.floor(rnd()*5)],flag:rnd()<0.07?(den?'DEN':'SWE'):null,ph:rnd()*6,phone:rnd()<0.18}); }
const walkers=[]; for(let i=0;i<14;i++) walkers.push({kit:i%2?SWE:DEN,skin:SKIN[i%5],hair:HAIR[(i*3)%5],num:[1,12,19,24,4,15,43,11,34,23,26,5,15,3][i],name:'',ph:i*0.7,x:0,y:0,vx:0,vy:-1});
function flag(x,y,kind,t){ const w=0.9,h=0.6, wv=Math.sin(t*6+x)*0.08;
  ctx.strokeStyle='#ddd'; ctx.lineWidth=0.04; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-1.3); ctx.stroke();
  ctx.save(); ctx.translate(x,y-1.3); ctx.transform(1,wv,0,1,0,0);
  if(kind==='DEN'){ ctx.fillStyle='#d0021b'; ctx.fillRect(0,0,w,h); ctx.fillStyle='#fff'; ctx.fillRect(0.28,0,0.11,h); ctx.fillRect(0,0.25,w,0.11); }
  else { ctx.fillStyle='#006aa7'; ctx.fillRect(0,0,w,h); ctx.fillStyle='#fecc02'; ctx.fillRect(0.28,0,0.11,h); ctx.fillRect(0,0.25,w,0.11); }
  ctx.restore(); }
function drawStands(cheer,dark){
  for(const side of [0,1]){
    const x0=side?21.2:-1.2, dir=side?1:-1;
    for(let row=8;row>=0;row--){ const sx=x0+dir*(row*0.62+0.2); ctx.fillStyle=row%2?'#2b3245':'#323a50'; ctx.fillRect(Math.min(sx,sx+dir*0.62),-4,0.62,30); }
    for(const c of crowd){ if(c.side!==side) continue; const x=x0+dir*(c.row*0.62+0.5), y=-3.4+c.k*1.12+(c.row%2)*0.5;
      const wave=cheer>0?Math.max(0,Math.sin(T*4-c.k*0.35-side*2))*cheer:0, bob=Math.sin(T*3+c.ph)*0.03, up=wave*0.25;
      ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(x-0.22,y+0.05,0.44,0.12);
      ctx.fillStyle=c.c; ctx.beginPath(); ctx.roundRect(x-0.2,y-0.35-up+bob,0.4,0.42,0.08); ctx.fill();
      if(wave>0.3){ ctx.strokeStyle=c.skin; ctx.lineWidth=0.08; ctx.beginPath(); ctx.moveTo(x-0.17,y-0.3-up); ctx.lineTo(x-0.25,y-0.75-up); ctx.moveTo(x+0.17,y-0.3-up); ctx.lineTo(x+0.25,y-0.75-up); ctx.stroke(); }
      ctx.fillStyle=c.skin; ctx.beginPath(); ctx.arc(x,y-0.48-up+bob,0.14,0,7); ctx.fill(); ctx.fillStyle=c.hair; ctx.beginPath(); ctx.arc(x,y-0.52-up+bob,0.14,Math.PI,Math.PI*2); ctx.fill();
      if(c.flag) flag(x+0.15,y-0.3-up,c.flag,T);
      if(dark>0.3&&c.phone&&Math.sin(T*2+c.ph)>-0.3){ ctx.fillStyle=`rgba(255,255,240,${0.9*dark})`; ctx.beginPath(); ctx.arc(x+0.12,y-0.75,0.06,0,7); ctx.fill(); }
    }
  }
}
function arena(){
  const S=720/26.5; ctx.setTransform(S,0,0,S,720/2-10*S,40);
  ctx.fillStyle='#141b2b'; ctx.fillRect(-20,-10,60,60);
  ctx.fillStyle='#2f78c9'; ctx.fillRect(0,-3,20,30); ctx.strokeStyle='#fff'; ctx.lineWidth=0.08; ctx.strokeRect(0,-3,20,30);
  ctx.beginPath(); ctx.moveTo(0,22); ctx.lineTo(20,22); ctx.stroke(); ctx.beginPath(); ctx.arc(10,22,1.8,0,7); ctx.stroke();
  ctx.fillStyle='#e0632f'; ctx.beginPath(); ctx.arc(10,-3,6,0,Math.PI); ctx.fill(); ctx.stroke();
  const t=T, dark=t<5.2?1:Math.max(0,1-(t-5.2)/0.8), cheer=t<5.2?0.15:Math.min(1,(t-5.2)/0.6);
  drawStands(cheer,dark);
  // spillerne går ind på række fra tunnelen og stiller sig på midterlinjen
  walkers.forEach((w,i)=>{ const team=i%2, idx=Math.floor(i/2), tgtX=team?10.9+idx*1.05:9.1-idx*1.05, laneX=10+(team?0.55:-0.55);
    const start=0.2+idx*0.45, walkT=(30-22.8)/3.0, sideT=Math.abs(tgtX-laneX)/1.6, e=t-start; let x=laneX, y=30;
    if(e<=0){ y=31; w.vx=0; w.vy=-1; }
    else if(e<walkT){ y=30-e*3.0; w.vx=0; w.vy=-1; }
    else if(e<walkT+sideT){ y=22.8; x=laneX+Math.sign(tgtX-laneX)*(e-walkT)*1.6; w.vx=Math.sign(tgtX-laneX); w.vy=0; }
    else { y=22.8; x=tgtX; w.vx=0; w.vy=1; }
    w.x=x; w.y=y; if(e>0&&e<walkT+sideT) w.ph+=0.22; else w.ph=0; if(y<30.5){ shadow(x,y); drawNew(w); } });
  // mørke og projektørkegler
  ctx.setTransform(1,0,0,1,0,0);
  if(dark>0){ ctx.fillStyle=`rgba(4,6,14,${0.78*dark})`; ctx.fillRect(0,0,720,720);
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<3;i++){ const cx=360+Math.sin(T*1.3+i*2.1)*230, cy=420+Math.cos(T*0.9+i*1.7)*170;
      const g=ctx.createRadialGradient(cx,cy,10,cx,cy,130); g.addColorStop(0,`rgba(255,250,220,${0.55*dark})`); g.addColorStop(1,'rgba(255,250,220,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,130,0,7); ctx.fill(); }
    ctx.globalCompositeOperation='source-over'; }
  if(t>5.2&&t<6.2){ ctx.fillStyle=`rgba(255,255,255,${0.35*(1-(t-5.2))})`; ctx.fillRect(0,0,720,720); } // lyset tændes
  caption(t<5.2?'INDLØB · PROJEKTØRLYS':'LYSET TÆNDES · TILSKUERNE JUBLER');
}
function caption(t){ ctx.setTransform(1,0,0,1,0,0); ctx.font='700 26px Arial'; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.lineWidth=5; ctx.strokeStyle='rgba(6,11,19,.85)'; ctx.strokeText(t,16,14); ctx.fillStyle='#f5b83d'; ctx.fillText(t,16,14); }
function retning(){
  const S=56; ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#0b1422'; ctx.fillRect(0,0,720,720);
  for(const side of [0,1]){
    ctx.setTransform(S,0,0,S,side*360+4,62); court(0,6.4);
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=0.04;
    for(const r of runners){ if(r.side!==side) continue; const [px,py]=pathPos(T,r.i), [qx,qy]=pathPos(T+0.02,r.i);
      r.x=1.5+px; r.y=3.6+py; r.vx=qx-px; r.vy=qy-py; r.ph+=0.32; }
    const rs=runners.filter(r=>r.side===side).sort((a,b)=>a.y-b.y);
    for(const r of rs){ shadow(r.x,r.y); if(side===0) drawSide(r,Math.sign(r.vx)||r.lastF||1); else drawNew(r); if(r.vx) r.lastF=Math.sign(r.vx); }
  }
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#0b1422'; ctx.fillRect(0,0,720,62); ctx.fillRect(358,0,4,720);
  ctx.font='700 24px Arial'; ctx.textAlign='center'; ctx.fillStyle='#9fb0c6'; ctx.fillText('I DAG: KUN FRA SIDEN',180,22); ctx.fillStyle='#f5b83d'; ctx.fillText('NYT: SIDE, FORFRA OG BAGFRA',540,22);
}
window.__tick=dt=>{ T+=dt; };
window.__render=()=>{ if(MODE==='arena') arena(); else retning(); };
</script></body></html>
